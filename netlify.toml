# Netlify configuration for the Astro (static + Keystatic) site.
[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Headers -------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Force HTTPS on repeat visits. Subdomains included: botiga. and gestio. are
    # both HTTPS-only. Deliberately NOT preloaded — that is hard to undo.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The site needs no device APIs at all, so switch them off.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Everything is first-party: no CDN, no embedded fonts, no third-party scripts.
    # `unsafe-inline` covers the two inline blocks Astro emits (JSON-LD, which is a
    # data block, and the opening-hours toggle). Hashes would be stricter, but they
    # would not defend against the realistic threat here — a compromised dependency
    # writing a script at build time hashes cleanly too. What this does buy is a
    # hard block on every EXTERNAL script origin, on framing, and on <base>.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Astro hashes these filenames, so they can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts. The filenames are stable, so give a new name if the font is
# ever swapped rather than shortening this.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Editors replace images in place, so these get a long-but-finite life instead of
# `immutable`. Previously they had no cache header at all and were revalidated on
# every single navigation.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pagefind ships a large prebuilt index that only changes when content does.
[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- Redirects from the old WordPress site -------------------------------------
#
# The old site is what Google still indexes, so these rules are what stops the
# migration from throwing away the domain's rankings and inbound links.
#
# Netlify applies netlify.toml rules BEFORE public/_redirects. The ~90 blog posts
# live at the site ROOT (/slug/, not /actualitat/slug/), so they cannot use a
# wildcard — one would swallow every page below. They are generated one-by-one
# into public/_redirects by scripts/gen-redirects.mjs.
#
# Rules are ordered most-specific first.

# --- Category archives. MUST precede anything matching /actualitat/*, because the
# --- new site puts individual posts at /actualitat/<post-slug>/.
[[redirects]]
  from = "/actualitat/receptes-foodcoop-bcn/"
  to = "/actualitat/categoria/receptes/"
  status = 301
[[redirects]]
  from = "/actualitat/acords-dintercooperacio/"
  to = "/actualitat/categoria/intercooperacio/"
  status = 301
[[redirects]]
  from = "/actualitat/comunitat/"
  to = "/actualitat/categoria/comunitat/"
  status = 301
[[redirects]]
  from = "/actualitat/socies/"
  to = "/actualitat/categoria/comunitat/"
  status = 301

