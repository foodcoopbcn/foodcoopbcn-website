# --- WordPress plumbing: answer 404 rather than redirect. These are probed
# --- constantly by bots and must not be dressed up as real pages.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404"
  status = 404
[[redirects]]
  from = "/wp-login.php"
  to = "/404"
  status = 404
[[redirects]]
  from = "/wp-json/*"
  to = "/404"
  status = 404
[[redirects]]
  from = "/xmlrpc.php"
  to = "/404"
  status = 404

# Spanish 404. Netlify only serves the root 404.html automatically; this makes
# anything unmatched under /es/ answer with the Spanish page (still a real 404
# status). It is last on purpose: every rule above wins, and real files always do.
[[redirects]]
  from = "/es/*"
  to = "/es/404"
  status = 404
