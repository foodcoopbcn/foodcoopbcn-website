    'page': '/legal/balanc-social'
'download': 'Descarrega el PDF'
'howTitle': 'Com prenem les decisions'
'how':
  - 't': 'L’assemblea'
    'd': 'És l’òrgan sobirà. Una sòcia, un vot, independentment del capital aportat. Hi aprovem els comptes, els criteris de producte i les decisions estratègiques.'
  - 't': 'Els cercles'
    'd': 'Vuit equips de treball preparen i executen: Compres, Comunicació, Finances, IT, Operacions, Comunitat i cures, Governança i Local.'
  - 't': 'El dia a dia'
    'd': 'Un equip contractat fa funcionar el súper amb el suport dels torns de les sòcies.'
'moneyTitle': 'On van els diners'
'money':
  - 't': 'Sense ànim de lucre'
    'd': 'Cap benefici es reparteix entre particulars. El que sobra torna al projecte.'
  - 't': 'Marges iguals per a tot'
    'd': 'Apliquem el mateix criteri a tot el catàleg. Sense productes reclam ni ofertes ganxo.'
  - 't': 'El capital social és de les sòcies'
    'd': 'Els {capital} € que aportes són teus i te’ls tornem si et dones de baixa.'
  - 't': 'Suport públic'
    'd': 'El projecte va rebre suport de l’Ajuntament de Barcelona i la Diputació en la fase d’arrencada.'
