'eyebrow': 'Fes-te sòcia'
'title': 'Els torns, sense lletra petita'
'intro': 'Un torn són {shiftHours} hores cada {shiftCycleWeeks} setmanes. No són hores setmanals: són unes dues hores i mitja al mes. I si no et va bé, hi ha dues alternatives que valen exactament igual.'
'cycleTitle': 'Què vol dir “cada 4 setmanes”'
'cycleText': 'Fas un torn, i el següent és quatre setmanes després. Al llarg d’un any són tretze torns d’unes dues hores i mitja: al voltant de trenta hores. Repartides, és menys temps del que molta gent passa fent la compra.'
'tasksTitle': 'Què s’hi fa'
'tasks':
  - 'Reposar producte a les lleixes'
  - 'Cobrar a caixa'
  - 'Rebre i col·locar comandes'
  - 'Endreçar i netejar la sala'
  - 'Atendre les sòcies i qui entra per primer cop'
  - 'Pesar i preparar el granel'
'tasksNote': 'No cal experiència prèvia. El primer torn el fas acompanyada d’algú que ja el coneix, i sempre hi ha una persona de l’equip contractat a la sala.'
'typesTitle': 'Fix o mòbil: tries'
'types':
  - 'icon': 'clock'
    't': 'Torn fix'
    'd': 'Sempre el mateix dia de la setmana i la mateixa franja. Si tens una rutina estable, és el més còmode: t’oblides de pensar-hi.'
  - 'icon': 'user'
    't': 'Torn mòbil'
    'd': 'Tries el dia cada cicle, segons com tinguis el mes. Va bé si treballes a torns o tens una agenda que canvia.'
  - 'icon': 'heart'
    't': 'Torn en tàndem'
    'd': 'Si viviu juntes, podeu compartir un mateix torn i repartir-vos-el entre les dues.'
'flexTitle': 'I si un mes no hi puc anar?'
'flex':
  - 'q': 'Puc canviar un torn de dia?'
    'a': 'Sí. Tens {flexibleChanges} canvis flexibles l’any, sense haver de donar explicacions.'
  - 'q': 'Puc intercanviar-lo amb una altra sòcia?'
    'a': 'Sí. És la via més habitual quan et sorgeix alguna cosa: t’ho canvies amb algú i llestos.'
  - 'q': 'I si m’oblido o em poso malalta?'
    'a': 'Es recupera més endavant. Això és una cooperativa de persones, no una fàbrica: el que necessitem és que el súper funcioni, no comptar-te les hores.'
  - 'q': 'Hi ha excepcions?'
    'a': 'Sí. Si tens més de 65 anys, mobilitat reduïda, una malaltia o estàs de maternitat o paternitat, el torn no és obligatori. Parla’n amb el cercle de comunitat i ho arreglem.'
'circlesTitle': 'L’alternativa: un cercle de treball'
'circlesText': 'Si el que et costa és el torn a la sala però tens ganes i temps, pots dedicar les mateixes hores a un dels cercles que fan funcionar la cooperativa. Bona part de la feina es fa des de casa.'
'circles':
  - 't': 'Compres'
    'd': 'Relació amb productores i selecció del catàleg.'
  - 't': 'Comunicació'
    'd': 'Xarxes, web, butlletí i relació amb els mitjans.'
  - 't': 'Finances'
    'd': 'Comptabilitat, tresoreria i control pressupostari.'
  - 't': 'IT'
    'd': 'Sistemes, botiga en línia i eines internes.'
  - 't': 'Operacions'
    'd': 'Funcionament diari del súper i organització dels torns.'
  - 't': 'Comunitat i cures'
    'd': 'Acollida de sòcies noves, participació i vida associativa.'
  - 't': 'Governança'
    'd': 'Assemblees, estatuts i presa de decisions.'
  - 't': 'Local'
    'd': 'Manteniment i millores de l’espai.'
'quotaTitle': 'L’altra alternativa: la quota'
'quotaText': 'Si ara mateix no pots dedicar-hi temps, pagues una quota trimestral i mantens absolutament tots els avantatges de sòcia: el {discount}% de descompte, la botiga en línia i el vot a l’assemblea.'
'quotaLink': 'Veure preus i quotes'
'finalTitle': 'Et fem un torn de prova?'
'finalText': 'Vine a una sessió informativa i t’ensenyem la sala, els torns i com s’organitza tot abans de decidir res.'
