'title': 'Un supermercat de totes i per a totes'
'intro': 'FoodCoop BCN és un supermercat cooperatiu, participatiu i sense ànim de lucre. Ens mou la sostenibilitat, la proximitat i el tracte just amb qui produeix el que mengem.'
'valuesTitle': 'Els nostres valors'
'valuesIntro': 'Un model just per a les persones, les productores i el planeta.'
'values':
  - 'icon': 'leaf'
    'title': 'Sostenible i de proximitat'
    'text': 'Prioritzem productores locals catalanes i productes agroecològics, a granel i amb poc envàs.'
  - 'icon': 'vote'
    'title': 'Transparència total'
    'text': 'Decisions preses en assemblea i marges visibles. Sense ànim de lucre: cap benefici privat.'
  - 'icon': 'heart'
    'title': 'Sa i assequible'
    'text': 'Més de 1.200 productes de qualitat a un preu just, perquè menjar bé sigui per a tothom.'
  - 'icon': 'user'
    'title': 'Comunitat'
    'text': 'Un projecte fet entre totes: les sòcies hi dediquen unes hores al mes i en decideixen el rumb.'
'factsTitle': 'Dades clau'
'facts':
  - 'k': 'Nom legal'
    'v': 'Foodcoop Barcelona SCCL'
  - 'k': 'Obertura'
    'v': '8 de febrer de 2022'
  - 'k': 'On som'
    'v': 'Passatge d’Aragó, 9 · Esquerra de l’Eixample'
  - 'k': 'Superfície'
    'v': '240 m²'
  - 'k': 'Referències'
    'v': 'Més de 1.200'
  - 'k': 'Sòcies'
    'v': '{members}'
  - 'k': 'Descompte sòcies'
    'v': '12%'
  - 'k': 'Participació'
    'v': '2-2,5 h cada 4 setmanes, cercle o quota'
'storyTitle': 'D’on venim'
'story':
  - 'El projecte va néixer d’una trobada el 2018, inspirat en models cooperatius d’èxit com La Louve (París) o la Bees Coop (Brussel·les), que demostren que una altra manera de fer supermercat és possible.'
  - 'Després d’anys de feina col·lectiva, vam obrir les portes al passatge d’Aragó. Avui som una comunitat de sòcies que decidim, treballem i comprem juntes.'
'govTitle': 'Com ens organitzem'
'govIntro': 'Decidim en assemblea i ens organitzem en cercles de treball especialitzats.'
'circles':
  - 'icon': 'user'
    'title': 'Comunitat i cures'
    'text': 'Acollida de sòcies noves, participació i vida associativa.'
  - 'icon': 'basket'
    'title': 'Compres'
    'text': 'Relació amb productores, criteris i selecció del catàleg.'
  - 'icon': 'clock'
    'title': 'Operacions'
    'text': 'Funcionament diari del súper i organització dels torns.'
  - 'icon': 'vote'
    'title': 'Finances'
    'text': 'Comptabilitat, tresoreria i control pressupostari.'
  - 'icon': 'mail'
    'title': 'Comunicació'
    'text': 'Xarxes, web, butlletí i relació amb els mitjans.'
  - 'icon': 'globe'
    'title': 'IT'
    'text': 'Sistemes, botiga en línia i eines internes.'
  - 'icon': 'check'
    'title': 'Governança'
    'text': 'Assemblees, estatuts i presa de decisions.'
  - 'icon': 'pin'
    'title': 'Local'
    'text': 'Manteniment i millores de l’espai del passatge d’Aragó.'
'membersTitle': 'Dos tipus de sòcies'
'members':
  - 'title': 'Sòcia consumidora'
    'text': 'Compra al súper, hi participa unes 2-2,5 h al mes i té vot a l’assemblea.'
  - 'title': 'Sòcia col·laboradora'
    'text': 'Aporta capital al projecte sense l’obligació de fer torns.'
