'eyebrow': 'Preus'
'title': 'Compara’ns amb altres supermercats'
'tableTitle': 'La cistella d’avui, producte a producte'
'intro': 'Els preus d’avui d’una selecció de productes bàsics a FoodCoop BCN i a quatre supermercats de Barcelona. Els recollim automàticament cada dia de les botigues en línia de cadascun.'
'unavailableTitle': 'Avui no podem mostrar la comparativa'
'unavailableText': 'Les dades de preus són massa antigues o no s’han pogut recollir. Preferim no ensenyar-te números que potser ja no són certs. Torna-ho a provar d’aquí a unes hores.'
'honestTitle': 'Per què publiquem això'
'honest':
  - 't': 'No sempre som els més barats'
    'd': 'I no ho amaguem. En producte fresc i de proximitat acostumem a estar-hi bé; en marques blanques industrials, no hi competim. Els gràfics i la taula ho ensenyen tot, incloses les botigues on perdem.'
  - 't': 'Comparem el que és comparable'
    'd': 'Cada fila busca el producte equivalent més proper a cada botiga i, si en té, la versió ecològica. Quan una cosa és eco i l’altra no, ho marquem, perquè no és el mateix producte.'
  - 't': 'Els preus són els públics de cada botiga'
    'd': 'Es recullen de les botigues en línia de cada establiment per a Barcelona, cada dia i de manera automàtica: el moment no el triem nosaltres. La cistella sí que la triem: són productes bàsics d’ús diari, un per categoria, i la publiquem sencera amb les botigues on perdem incloses.'
  - 't': 'El preu de sòcia, i també el públic'
    'd': 'Comparem amb el preu de sòcia, que és el que pagues si en formes part. A la taula, sota de cada preu, hi tens també el públic que paga qualsevol persona que entri. Els dos surten de la nostra botiga en línia; no en calculem cap.'
'finalTitle': 'Val la pena fer-se’n sòcia?'
'finalText': 'Depèn del que compris. Amb el preu de sòcia la resposta acostuma a ser que sí, però els números els tens aquí sobre: mira-te’ls tu mateixa.'
