'eyebrow': 'Quiénes somos'
'title': 'Transparencia'
'intro': 'Los documentos que explican cómo funciona la cooperativa, quién decide qué y dónde va el dinero. Todo es público y descargable.'
'docsTitle': 'Documentos'
'docs':
  - 'icon': 'doc'
    't': 'Estatutos'
    'd': 'Las reglas que nos hemos dado: derechos y deberes de las socias, órganos de decisión, aportaciones y bajas.'
    'href': '/docs/estatuts.pdf'
    'page': '/legal/estatuts'
  - 'icon': 'chart'
    't': 'Memoria de actividades'
    'd': 'Qué hemos hecho durante el ejercicio: actividad del súper, proyecto asociativo y cuentas.'
    'href': '/docs/memoria.pdf'
    'page': '/legal/memoria'
  - 'icon': 'scale'
    't': 'Balance social'
    'd': 'La auditoría social de la Xarxa d’Economia Solidària: condiciones laborales, democracia interna, impacto ambiental y gestión económica.'
    'href': '/docs/balanc-social.pdf'
    'page': '/legal/balanc-social'
'download': 'Descargar el PDF'
'howTitle': 'Cómo tomamos las decisiones'
'how':
  - 't': 'La asamblea'
    'd': 'Es el órgano soberano. Una socia, un voto, independientemente del capital aportado. Aprobamos las cuentas, los criterios de producto y las decisiones estratégicas.'
  - 't': 'Los círculos'
    'd': 'Ocho equipos de trabajo preparan y ejecutan: Compras, Comunicación, Finanzas, IT, Operaciones, Comunidad y cuidados, Gobernanza y Local.'
  - 't': 'El día a día'
    'd': 'Un equipo contratado hace funcionar el súper con el apoyo de los turnos de las socias.'
'moneyTitle': 'Dónde va el dinero'
'money':
  - 't': 'Sin ánimo de lucro'
    'd': 'Ningún beneficio se reparte entre particulares. Lo que sobra vuelve al proyecto.'
  - 't': 'Márgenes iguales para todo'
    'd': 'Aplicamos el mismo criterio a todo el catálogo. Sin productos reclamo ni ofertas gancho.'
  - 't': 'El capital social es de las socias'
    'd': 'Los {capital} € que aportas son tuyos y te los devolvemos si te das de baja.'
  - 't': 'Apoyo público'
    'd': 'El proyecto recibió apoyo del Ayuntamiento de Barcelona y la Diputación en la fase de arranque.'
