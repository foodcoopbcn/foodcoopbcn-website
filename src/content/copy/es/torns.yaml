'eyebrow': 'Hazte socia'
'title': 'Los turnos, sin letra pequeña'
'intro': 'Un turno son {shiftHours} horas cada {shiftCycleWeeks} semanas. No son horas semanales: son unas dos horas y media al mes. Y si no te va bien, hay dos alternativas que valen exactamente igual.'
'cycleTitle': 'Qué quiere decir “cada 4 semanas”'
'cycleText': 'Haces un turno, y el siguiente es cuatro semanas después. A lo largo de un año son trece turnos de unas dos horas y media: alrededor de treinta horas. Repartidas, es menos tiempo del que mucha gente pasa haciendo la compra.'
'tasksTitle': 'Qué se hace'
'tasks':
  - 'Reponer producto en las estanterías'
  - 'Cobrar en caja'
  - 'Recibir y colocar pedidos'
  - 'Ordenar y limpiar la sala'
  - 'Atender a las socias y a quien entra por primera vez'
  - 'Pesar y preparar el granel'
'tasksNote': 'No hace falta experiencia previa. El primer turno lo haces acompañada de alguien que ya lo conoce, y siempre hay una persona del equipo contratado en la sala.'
'typesTitle': 'Fijo o móvil: eliges'
'types':
  - 'icon': 'clock'
    't': 'Turno fijo'
    'd': 'Siempre el mismo día de la semana y la misma franja. Si tienes una rutina estable, es lo más cómodo: te olvidas de pensar en ello.'
  - 'icon': 'user'
    't': 'Turno móvil'
    'd': 'Eliges el día cada ciclo, según cómo tengas el mes. Va bien si trabajas a turnos o tienes una agenda que cambia.'
  - 'icon': 'heart'
    't': 'Turno en tándem'
    'd': 'Si vivís juntas, podéis compartir un mismo turno y repartíroslo entre las dos.'
'flexTitle': '¿Y si un mes no puedo ir?'
'flex':
  - 'q': '¿Puedo cambiar un turno de día?'
    'a': 'Sí. Tienes {flexibleChanges} cambios flexibles al año, sin tener que dar explicaciones.'
  - 'q': '¿Puedo intercambiarlo con otra socia?'
    'a': 'Sí. Es la vía más habitual cuando te surge algo: te lo cambias con alguien y listo.'
  - 'q': '¿Y si se me olvida o me pongo enferma?'
    'a': 'Se recupera más adelante. Esto es una cooperativa de personas, no una fábrica: lo que necesitamos es que el súper funcione, no contarte las horas.'
  - 'q': '¿Hay excepciones?'
    'a': 'Sí. Si tienes más de 65 años, movilidad reducida, una enfermedad o estás de maternidad o paternidad, el turno no es obligatorio. Háblalo con el círculo de comunidad y lo arreglamos.'
'circlesTitle': 'La alternativa: un círculo de trabajo'
'circlesText': 'Si lo que te cuesta es el turno en la sala pero tienes ganas y tiempo, puedes dedicar las mismas horas a uno de los círculos que hacen funcionar la cooperativa. Buena parte del trabajo se hace desde casa.'
'circles':
  - 't': 'Compras'
    'd': 'Relación con productoras y selección del catálogo.'
  - 't': 'Comunicación'
    'd': 'Redes, web, boletín y relación con los medios.'
  - 't': 'Finanzas'
    'd': 'Contabilidad, tesorería y control presupuestario.'
  - 't': 'IT'
    'd': 'Sistemas, tienda online y herramientas internas.'
  - 't': 'Operaciones'
    'd': 'Funcionamiento diario del súper y organización de los turnos.'
  - 't': 'Comunidad y cuidados'
    'd': 'Acogida de socias nuevas, participación y vida asociativa.'
  - 't': 'Gobernanza'
    'd': 'Asambleas, estatutos y toma de decisiones.'
  - 't': 'Local'
    'd': 'Mantenimiento y mejoras del espacio.'
'quotaTitle': 'La otra alternativa: la cuota'
'quotaText': 'Si ahora mismo no puedes dedicarle tiempo, pagas una cuota trimestral y mantienes absolutamente todas las ventajas de socia: el {discount}% de descuento, la tienda online y el voto en la asamblea.'
'quotaLink': 'Ver precios y cuotas'
'finalTitle': '¿Te enseñamos un turno?'
'finalText': 'Ven a una sesión informativa y te enseñamos la sala, los turnos y cómo se organiza todo antes de decidir nada.'
