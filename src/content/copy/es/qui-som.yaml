'title': 'Un supermercado de todas y para todas'
'intro': 'FoodCoop BCN es un supermercado cooperativo, participativo y sin ánimo de lucro. Nos mueve la sostenibilidad, la proximidad y el trato justo con quien produce lo que comemos.'
'valuesTitle': 'Nuestros valores'
'valuesIntro': 'Un modelo justo para las personas, las productoras y el planeta.'
'values':
  - 'icon': 'leaf'
    'title': 'Sostenible y de proximidad'
    'text': 'Priorizamos productoras locales catalanas y productos agroecológicos, a granel y con poco envase.'
  - 'icon': 'vote'
    'title': 'Transparencia total'
    'text': 'Decisiones tomadas en asamblea y márgenes visibles. Sin ánimo de lucro: ningún beneficio privado.'
  - 'icon': 'heart'
    'title': 'Sano y asequible'
    'text': 'Más de 1.200 productos de calidad a un precio justo, para que comer bien sea para todo el mundo.'
  - 'icon': 'user'
    'title': 'Comunidad'
    'text': 'Un proyecto hecho entre todas: las socias le dedican unas horas al mes y deciden su rumbo.'
'factsTitle': 'Datos clave'
'facts':
  - 'k': 'Nombre legal'
    'v': 'Foodcoop Barcelona SCCL'
  - 'k': 'Apertura'
    'v': '8 de febrero de 2022'
  - 'k': 'Dónde estamos'
    'v': 'Passatge d’Aragó, 9 · Esquerra de l’Eixample'
  - 'k': 'Superficie'
    'v': '240 m²'
  - 'k': 'Referencias'
    'v': 'Más de 1.200'
