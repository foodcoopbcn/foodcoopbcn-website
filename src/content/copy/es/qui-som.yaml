    'v': '{members}'
  - 'k': 'Descuento socias'
    'v': '12%'
  - 'k': 'Participación'
    'v': '2-2,5 h cada 4 semanas, círculo o cuota'
'storyTitle': 'De dónde venimos'
'story':
  - 'El proyecto nació de un encuentro en 2018, inspirado en modelos cooperativos de éxito como La Louve (París) o la Bees Coop (Bruselas), que demuestran que otra manera de hacer supermercado es posible.'
  - 'Tras años de trabajo colectivo, abrimos las puertas en el pasaje de Aragó. Hoy somos una comunidad de socias que decidimos, trabajamos y compramos juntas.'
'govTitle': 'Cómo nos organizamos'
'govIntro': 'Decidimos en asamblea y nos organizamos en círculos de trabajo especializados.'
'circles':
  - 'icon': 'user'
    'title': 'Comunidad y cuidados'
    'text': 'Acogida de socias nuevas, participación y vida asociativa.'
  - 'icon': 'basket'
    'title': 'Compras'
    'text': 'Relación con productoras, criterios y selección del catálogo.'
  - 'icon': 'clock'
    'title': 'Operaciones'
    'text': 'Funcionamiento diario del súper y organización de los turnos.'
  - 'icon': 'vote'
    'title': 'Finanzas'
    'text': 'Contabilidad, tesorería y control presupuestario.'
  - 'icon': 'mail'
    'title': 'Comunicación'
    'text': 'Redes, web, boletín y relación con los medios.'
  - 'icon': 'globe'
    'title': 'IT'
    'text': 'Sistemas, tienda online y herramientas internas.'
  - 'icon': 'check'
    'title': 'Gobernanza'
    'text': 'Asambleas, estatutos y toma de decisiones.'
  - 'icon': 'pin'
    'title': 'Local'
    'text': 'Mantenimiento y mejoras del espacio del pasaje de Aragó.'
'membersTitle': 'Dos tipos de socias'
'members':
  - 'title': 'Socia consumidora'
    'text': 'Compra en el súper, participa unas 2-2,5 h al mes y tiene voto en la asamblea.'
  - 'title': 'Socia colaboradora'
    'text': 'Aporta capital al proyecto sin la obligación de hacer turnos.'
