'eyebrow': 'Precios'
'title': 'Compáranos con otros supermercados'
'tableTitle': 'La cesta de hoy, producto a producto'
'intro': 'Los precios de hoy de una selección de productos básicos en FoodCoop BCN y en cuatro supermercados de Barcelona. Los recogemos automáticamente cada día de las tiendas en línea de cada uno.'
'unavailableTitle': 'Hoy no podemos mostrar la comparativa'
'unavailableText': 'Los datos de precios son demasiado antiguos o no se han podido recoger. Preferimos no enseñarte números que quizá ya no sean ciertos. Vuelve a probar dentro de unas horas.'
'honestTitle': 'Por qué publicamos esto'
'honest':
  - 't': 'No siempre somos los más baratos'
    'd': 'Y no lo escondemos. En producto fresco y de proximidad solemos estar bien; en marcas blancas industriales, no competimos. Los gráficos y la tabla lo enseñan todo, incluidas las tiendas donde perdemos.'
  - 't': 'Comparamos lo que es comparable'
    'd': 'Cada fila busca el producto equivalente más cercano en cada tienda y, si lo tiene, la versión ecológica. Cuando una cosa es eco y la otra no, lo marcamos, porque no es el mismo producto.'
  - 't': 'Los precios son los públicos de cada tienda'
    'd': 'Se recogen de las tiendas en línea de cada establecimiento para Barcelona, cada día y de forma automática: el momento no lo elegimos nosotras. La cesta sí la elegimos: son productos básicos de uso diario, uno por categoría, y la publicamos entera con las tiendas donde perdemos incluidas.'
  - 't': 'El precio de socia, y también el público'
    'd': 'Comparamos con el precio de socia, que es el que pagas si formas parte. En la tabla, debajo de cada precio, tienes también el público que paga cualquier persona que entre. Los dos salen de nuestra tienda en línea; no calculamos ninguno.'
'finalTitle': '¿Vale la pena hacerse socia?'
'finalText': 'Depende de lo que compres. Con el precio de socia la respuesta suele ser que sí, pero los números los tienes aquí arriba: míratelos tú misma.'
