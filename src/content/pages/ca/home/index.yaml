sections:
  - discriminant: hero
    value:
      eyebrow: ''
      title: El súper del barri que és de les seves clientes
      highlights:
        - Obert a tothom, també si no ets sòcia
        - 12% de descompte per a les sòcies
        - Agroecològic, de proximitat i a granel
      text: >-
        Som el primer supermercat cooperatiu, participatiu i sense ànim de lucre
        de Barcelona. Més de 1.200 productes a un preu just, perquè aquí ningú
        no s’emporta el marge.
      image: hero-entrada
      imageAlt: Sòcies de FoodCoop BCN entrant i sortint del súper al passatge d’Aragó
      primaryCta:
        label: Fes-te sòcia
        href: /fes-te-socia
      secondaryCta:
        label: Vine a comprar
        href: /el-super
  - discriminant: infoStrip
    value:
      addressLabel: ''
  - discriminant: featureGrid
    value:
      eyebrow: Com funciona
      title: Un súper cooperatiu, en tres passos
      intro: >-
        No cal decidir res avui. Aquest és tot el compromís que hi ha, de menys
        a més.
      tone: paper
      columns: '3'
      features:
        - icon: basket
          title: 1. Entra i compra
          text: >-
            El súper és obert a tothom des del 2023. Sense carnet, sense quota i
            sense fer-te sòcia de res. Vine, mira i compra a preu públic.
        - icon: heart
          title: 2. Si t’agrada, fes-te’n sòcia
          text: >-
            Una aportació de 40 € que és teva i et tornem si pleges. A canvi,
            un 12% de descompte en tot, per sempre.
        - icon: vote
          title: 3. Tria com hi participes
          text: >-
            Un torn de 2,5 h cada 4 setmanes, un cercle de treball des de casa o
            una quota trimestral des de 10 €. Les tres valen igual.
  - discriminant: mediaSplit
    value:
      eyebrow: Qui som
      title: Un súper que és de qui hi compra
      text: >-
        Som una cooperativa de consum sense ànim de lucre. Les sòcies en són
        propietàries, hi dediquen unes hores al mes i en decideixen el rumb en
        assemblea. Ni inversors, ni beneficis privats: només bon menjar a un
        preu just.
      image: socies-davantal
      imageAlt: Dues sòcies amb el davantal de FoodCoop, amb bolets i verdura acabats de rebre
      reverse: false
      tone: soft
      cta:
        label: Coneix el projecte
        href: /qui-som
  - discriminant: stats
    value:
      title: ''
      tone: ink
      stats:
        - value: '{socies}'
          label: Sòcies
          icon: user
        - value: '2022'
          label: Obert des de
          icon: clock
        - value: 1.200+
          label: Productes
          icon: basket
        - value: 12%
          label: Descompte sòcies
          icon: heart
      cta:
        label: ''
        href: /
  - discriminant: comparisonTable
    value:
      eyebrow: FoodCoop BCN
      title: Dues maneres de comprar
      intro: >-
        Pots comprar-hi sense ser sòcia, o fer-te’n part i gaudir de tots els
        avantatges.
      tone: soft
      columns:
        - label: Públic general
          featured: false
        - label: Sòcies
          featured: true
      rows:
        - label: Comprar a la botiga
          values:
            - 'yes'
            - 'yes'
        - label: Preu general
          values:
            - 'yes'
            - 'yes'
        - label: Preu sòcia (12% dte.)
          values:
            - 'no'
            - 'yes'
        - label: Botiga online
          values:
            - 'no'
            - 'yes'
        - label: Participació en el projecte
          values:
            - 'no'
            - 'yes'
      primaryCta:
        label: Vull comprar
        href: 'https://botiga.foodcoopbcn.cat/'
      secondaryCta:
        label: Fes-te’n sòcia
        href: /fes-te-socia
  - discriminant: priceTeaser
    value:
      eyebrow: ''
      title: ''
      tone: green
  - discriminant: photoCards
    value:
      title: Què pots comprar a Foodcoop
      intro: >-
        Més de 1.200 productes amb criteris de proximitat, sostenibilitat i preu
        just.
      layout: tile
      columns: '6'
      tone: paper
      items:
        - image: fam-fruita-verdura
          imageAlt: Prunes de temporada al taulell de fruita
          title: Fruita i verdura
          cta:
            label: Veure fruita i verdura
            href: /productes
        - image: fam-frescos
          imageAlt: Nevera de producte fresc del súper
          title: Frescos
          cta:
            label: Veure frescos
            href: /productes
        - image: fam-rebost
          imageAlt: Prestatges de conserves i pots de vidre
          title: Rebost
          cta:
            label: Veure rebost
            href: /productes
        - image: fam-granel
          imageAlt: Pots i dispensadors de la zona de granel
          title: Granel
          cta:
            label: Veure granel
            href: /productes
        - image: fam-llar-cura
          imageAlt: Passadís de drogueria i productes de neteja
          title: Llar i cura
          cta:
            label: Veure llar i cura
            href: /productes
        - image: fam-forn
          imageAlt: Pans de massa mare en un prestatge
          title: Forn i pa
          cta:
            label: Veure forn i pa
            href: /productes
  - discriminant: photoCards
    value:
      layout: card
      columns: '3'
      tight: true
      tone: soft
      items:
        - image: card-cistella
          imageAlt: Sòcia triant verdura amb la cistella groga del súper
          title: Cistella bàsica
          text: 55 productes essencials a preus accessibles.
          cta:
            label: Veure cistella
            href: /comparativa
        - image: card-proveidors
          imageAlt: Repartiment de pa amb bici de càrrega a la porta del súper
          title: Proveïdors
          text: Coneix les persones i projectes que hi ha darrere dels productes.
          cta:
            label: Veure proveïdors
            href: /productes
        - image: card-criteris
          imageAlt: Mapa il·lustrat de l’origen dels productes que venem
          title: Els criteris
          text: Així decidim què venem i amb quins principis treballem.
          cta:
            label: Veure criteris
            href: /productes
  - discriminant: showcaseBand
    value:
      eyebrow: El projecte
      title: '{socies} sòcies i cap accionista'
      text: >-
        Les decisions grosses les prenem en assemblea, oberta a totes les
        sòcies. Aquí ningú no s’emporta el marge: el que estalviem torna al
        preu.
      image: banner-comunitat
      imageAlt: Una assemblea de sòcies feta dins del súper, entre els prestatges
      align: left
      height: md
      primaryCta:
        label: Coneix el projecte
        href: /qui-som
      secondaryCta:
        label: ''
        href: /
  - discriminant: stats
    value:
      title: El 72% de la fruita i verdura és de Catalunya, i el 94% dels lactis també.
      tone: green
      stats:
        - value: 72%
          label: Fruita i verdura de Catalunya
          icon: leaf
        - value: 94%
          label: Lactis de Catalunya
          icon: heart
      cta:
        label: Saber-ne més
        href: /productes
  - discriminant: newsTeaser
    value:
      title: Actualitat del projecte
      tone: paper
      limit: 3
  - discriminant: ctaSection
    value:
      title: Comença per venir un dia
      text: >-
        No cal decidir res avui. Vine, tafaneja i pregunta-li a qui hi hagi a
        caixa. Si t’agrada, ja en parlarem.
      primaryCta:
        label: Horari i com arribar-hi
        href: /el-super
      secondaryCta:
        label: Fer-me sòcia
        href: /fes-te-socia
