sections:
  - discriminant: hero
    value:
      eyebrow: Supermercado cooperativo de Barcelona
      title: Buenos productos para ti y para la tierra
      highlights:
        - Decisiones y márgenes transparentes
        - Productos sostenibles y de proximidad
        - Buen ambiente y comunidad
      text: >-
        El primer supermercado cooperativo, participativo y sin ánimo de lucro de
        Barcelona. Productos buenos, sanos y a un precio justo, sin márgenes para
        nadie.
      primaryCta:
        label: Hazte socia
        href: /fes-te-socia
      secondaryCta:
        label: Visita el súper
        href: /el-super
  - discriminant: featureGrid
    value:
      eyebrow: ''
      title: ¿Por qué FoodCoop?
      intro: Un modelo justo para las personas, los productores y el planeta.
      tone: paper
      columns: '4'
      features:
        - icon: leaf
          title: Sostenible y de proximidad
          text: >-
            Priorizamos productores locales catalanes y productos agroecológicos, a
            granel y con poco envase.
        - icon: vote
          title: Transparencia total
          text: >-
            Decisiones tomadas en asamblea y márgenes visibles. Sin ánimo de lucro:
            ningún beneficio privado.
        - icon: heart
          title: Sano y asequible
          text: >-
            Más de 1.200 productos de calidad a un precio justo, para que comer bien
            sea para todo el mundo.
        - icon: user
          title: Comunidad
          text: >-
            Un proyecto hecho entre todas: las socias dedican unas horas al mes y
            deciden su rumbo.
  - discriminant: splitCards
    value:
      eyebrow: FoodCoop BCN
      title: Dos maneras de comprar
      intro: Puedes comprar sin ser socia, o formar parte y disfrutar de todas las ventajas.
      tone: soft
      options:
        - badge: Abierto a todos
          title: Compra pública
          text: >-
            No hace falta ser socia para comprar en el súper. Ven y descubre
            nuestros productos.
          points:
            - Sin cuota ni compromiso
            - Productos a granel y de proximidad
            - Horario amplio de lunes a sábado
          featured: false
          cta:
            label: Visita el súper
            href: /el-super
        - badge: Recomendado
          title: Hazte socia
          text: Forma parte del proyecto, decide y ahorra.
          points:
            - 12% de descuento en todos los productos
            - Acceso a la tienda online con reparto en bici
            - Voto en las asambleas
            - Participación de unas 2-2,5 h al mes
          featured: true
          cta:
            label: Hazte socia
            href: /fes-te-socia
  - discriminant: stats
    value:
      tone: ink
      stats:
        - value: '1.200+'
          label: Productos
        - value: '12%'
          label: Descuento socias
        - value: '100%'
          label: Sin ánimo de lucro
        - value: '0'
          label: Márgenes privados
  - discriminant: newsTeaser
    value:
      title: Actualidad del proyecto
      tone: paper
      limit: 3
  - discriminant: ctaSection
    value:
      title: ¿Quieres formar parte del proyecto?
      text: >-
        Hazte socia y ayúdanos a construir otra manera de alimentarnos en
        Barcelona.
      primaryCta:
        label: Hazte socia
        href: /fes-te-socia
      secondaryCta:
        label: Contacto
        href: /contacte
